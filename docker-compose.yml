version: '3.8'

services:
  pxewebui:
    image: pxewebui:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pxewebui
    restart: unless-stopped
    # host network mode is required so the container can receive broadcast DHCP packets (UDP 67)
    network_mode: host
    environment:
      - PXE_BIND_ADDR=0.0.0.0:8080
      - PXE_HTTP_PORT=8080
      - PXE_TFTP_PORT=69
      # Optional: set explicitly or let it auto-detect host IP
      # - PXE_SERVER_IP=192.168.1.100
      - PXE_DATA_DIR=/data
      - PXE_ISO_DIR=/isos
      - PXE_TFTP_DIR=/tftp
      - RUST_LOG=info,pxewebui=debug
    volumes:
      - ./data:/data
      - ./isos:/isos
      - ./tftp:/tftp
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
