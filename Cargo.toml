[package]
name = "pxewebui"
version = "1.0.0"
edition = "2021"
authors = ["PxeWebUI Team"]
description = "Modern and sleek Web UI and PXE Server for network booting ISOs"

[dependencies]
# Web framework & async runtime
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.36", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-gzip", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# HTTP Client for ISO downloads
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# Authentication & Crypto
bcrypt = "0.15"
base64 = "0.22"
rand = "0.8"

# Utilities & System Monitoring
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8.3", features = ["compression"] }
mime_guess = "2.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
local-ip-address = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
